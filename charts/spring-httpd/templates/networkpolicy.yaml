{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}-frontend
  namespace: {{ .Values.namespaces.frontend }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.routerNamespaceSelector | nindent 12 }}
          podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.frontend.port }}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}-backend
  namespace: {{ .Values.namespaces.backend }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" (dict "root" . "component" "backend") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.frontend | quote }}
          podSelector:
            matchLabels:
              {{- include "app.selector" (dict "root" . "component" "frontend") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.backend.port }}}
{{- end }}
