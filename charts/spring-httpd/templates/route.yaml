{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Values.namespaces.frontend }}
spec:
  host: {{ required "route.host requis" .Values.route.host | quote }}
  to:
    kind: Service
    name: {{ include "app.name" . }}-frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
