{{- range $component := list "frontend" "backend" }}
{{- $cfg := index $.Values $component }}
{{- $ns := index $.Values.namespaces $component }}
{{- $ctx := dict "root" $ "component" $component }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.name" $ }}-{{ $component }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" $ }}-{{ $component }}
  namespace: {{ $ns }}
spec:
  replicas: {{ $cfg.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "app.selector" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selector" $ctx | nindent 8 }}
      {{- if eq $component "frontend" }}
      annotations:
        checksum/httpd: {{ include (print $.Template.BasePath "/httpd-config.yaml") $ | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "app.name" $ }}-{{ $component }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: {{ $cfg.image | quote }}
          imagePullPolicy: {{ $cfg.imagePullPolicy }}
          {{- if eq $component "frontend" }}
          command: [/usr/sbin/httpd]
          args: [-f, /etc/custom-httpd/httpd.conf, -DFOREGROUND]
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $cfg.port }}, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            {{- if eq $component "frontend" }}
            readOnlyRootFilesystem: true
            {{- end }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          {{- if eq $component "backend" }}
          {{- with $cfg.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cfg.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            {{- toYaml $cfg.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $cfg.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml $cfg.livenessProbe | nindent 12 }}
          {{- else }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          {{- end }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if eq $component "frontend" }}
            - {name: runtime, mountPath: /run/httpd}
            - {name: httpd-config, mountPath: /etc/custom-httpd, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq $component "frontend" }}
        - name: runtime
          emptyDir: {}
        - name: httpd-config
          configMap:
            name: {{ include "app.name" $ }}-httpd
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" $ }}-{{ $component }}
  namespace: {{ $ns }}
spec:
  type: ClusterIP
  selector:
    {{- include "app.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ if eq $component "backend" }}{{ $cfg.servicePort }}{{ else }}{{ $cfg.port }}{{ end }}
      targetPort: http
      protocol: TCP
{{- end }}
