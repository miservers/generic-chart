{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.frontendNamespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.frontendPodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.port }}}
{{- end }}
