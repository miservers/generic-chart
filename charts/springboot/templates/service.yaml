apiVersion: v1
kind: Service
metadata:
  name: {{ include "springboot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "springboot.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "springboot.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: http
      protocol: TCP
