{{- if eq .Values.workloadKind "StatefulSet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.headlessName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  # DNS stable même hors readiness ; HTTPD contrôle la readiness directement.
  publishNotReadyAddresses: true
  selector:
    {{- include "app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
