# Affinite du routeur : enabled ou disabled (independante pour chaque chart).
session: enabled
appName: ""  # Requis : fourni par l’Application ou les valeurs d’environnement.
# Injectes par Application.spec.source.helm.parameters.
clusterName: ""
# Domaine fixe de l’organisation : remplacer cet exemple dans les deux charts.
baseDomain: example.com
environment: ""
fullnameOverride: ''
imagePullSecrets: []
image: registry.example.com/equipe/monapp:1.0.0
imagePullPolicy: IfNotPresent
replicas: 2
port: 8080
servicePort: 8080
env:
- name: SERVER_FORWARD_HEADERS_STRATEGY
  value: framework
- name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
  value: 'true'
- name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
  value: health
envFrom: []
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: '1'
    memory: 1Gi
startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 60
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
javaToolOptions: ''
podAnnotations: {}
certificates: []
extraVolumes: []
extraVolumeMounts: []
appdynamics:
  enabled: false
  agentImage: ''
  agentSourceDir: /opt/appdynamics
  controller:
    host: ''
    port: 443
    ssl: true
  applicationName: ''
  tierName: ''
  accountName: ''
  accessKeySecret:
    name: ''
    key: access-key
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
networkPolicy:
  enabled: true
  routerNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
route:
  enabled: true
  host: ""
  cookieName: ""  # Requis si route.enabled et session=enabled.
  labels:
    ingress-scope: internal
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: never
