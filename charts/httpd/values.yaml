appName: monapp
fullnameOverride: ''
imagePullSecrets: []
image: registry.access.redhat.com/ubi9/httpd-24:latest
imagePullPolicy: IfNotPresent
replicas: 2
port: 8080
proxyTimeout: 60
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
route:
  enabled: true
  host: monapp-int.apps.example.com
  cookieName: MONAPP_INT_FRONT
  labels: {}
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: replace
networkPolicy:
  enabled: true
  routerNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
backendRoute:
  host: monapp-back-int.apps-internal.example.com
  caSecretName: ''
  caSecretKey: ca.crt
