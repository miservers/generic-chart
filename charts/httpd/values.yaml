# Affinite du routeur : enabled ou disabled (independante pour chaque chart).
session: enabled
appName: ""  # Requis : fourni par l’Application ou les valeurs d’environnement.
# Injectes par Application.spec.source.helm.parameters.
clusterName: ""
# Domaine fixe de l’organisation : remplacer cet exemple dans les deux charts.
baseDomain: example.com
environment: ""
fullnameOverride: ''
imagePullSecrets: []
image: registry.access.redhat.com/hi/httpd:latest
imagePullPolicy: Always
replicas: 2
port: 8080
proxyTimeout: 60
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
route:
  enabled: true
  host: ""
  cookieName: ""  # Requis si route.enabled et session=enabled.
  labels: {}
  annotations:
    haproxy.router.openshift.io/set-forwarded-headers: replace
networkPolicy:
  enabled: true
  egress:
    enabled: false
    # Namespace des pods routeurs, pas celui de l’operateur.
    routerNamespace: openshift-ingress
    # Vide : tous les pods du namespace sur TCP/443.
    routerPodSelector: {}
    # IPv4 DNS et port tels que vus par la NetworkPolicy (a valider sur le cluster).
    dnsIPs: []
    dnsPort: 53
  routerNamespaceSelector:
    matchLabels:
      network.openshift.io/policy-group: ingress
backendRoute:
  host: ""
  caSecretName: ''
  caSecretKey: ca.crt
