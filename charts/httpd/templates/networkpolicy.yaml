{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.routerNamespaceSelector | nindent 12 }}
          podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.port }}}
  {{- if .Values.networkPolicy.egress.enabled }}
  {{- if not .Values.networkPolicy.egress.backendRouteIPs }}
  {{- fail "networkPolicy.egress.backendRouteIPs requis lorsque egress est active" }}
  {{- end }}
  {{- $backendRouteIPs := .Values.networkPolicy.egress.backendRouteIPs }}
  {{- if not .Values.networkPolicy.egress.dnsIPs }}
  {{- fail "networkPolicy.egress.dnsIPs requis lorsque egress est active" }}
  {{- end }}
  {{- $dnsIPs := .Values.networkPolicy.egress.dnsIPs }}
  egress:
    - to:
        {{- range $backendRouteIPs }}
        - ipBlock:
            cidr: "{{ . }}/32"
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        {{- range $dnsIPs }}
        - ipBlock:
            cidr: "{{ . }}/32"
        {{- end }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
  {{- end }}
{{- end }}
