{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "httpd.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "httpd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "httpd.selector" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.routerNamespaceSelector | nindent 12 }}
          podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.port }}}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.routerNamespace | quote }}
          podSelector:
            {{- toYaml .Values.networkPolicy.egress.routerPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 443
    - to:
        {{- range .Values.networkPolicy.egress.dnsIPs }}
        - ipBlock:
            cidr: "{{ . }}/32"
        {{- end }}
      ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.dnsPort }}
  {{- end }}
{{- end }}
