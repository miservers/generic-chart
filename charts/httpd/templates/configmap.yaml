apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
data:
  httpd.conf: |
    ServerRoot "/etc/httpd"
    Listen {{ .Values.port }}
    ServerName https://{{ .Values.route.host }}:443
    UseCanonicalName On
    PidFile /run/httpd/httpd.pid
    DefaultRuntimeDir /run/httpd
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule log_config_module modules/mod_log_config.so
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_http_module modules/mod_proxy_http.so
    LoadModule headers_module modules/mod_headers.so
    LoadModule ssl_module modules/mod_ssl.so
    User apache
    Group apache
    ServerTokens Prod
    ServerSignature Off
    TraceEnable Off
    ErrorLog /proc/self/fd/2
    LogFormat "%h %l %u %t \"%r\" %>s %b" main
    CustomLog /proc/self/fd/1 main
    LogLevel warn
    <Directory />
      Require all denied
    </Directory>
    ProxyRequests Off
    # Le Host ET le SNI doivent désigner la Route backend.
    ProxyPreserveHost Off
    ProxyAddHeaders Off
    ProxyTimeout {{ .Values.proxyTimeout }}
    SSLProxyEngine On
    SSLProxyVerify require
    SSLProxyVerifyDepth 5
    SSLProxyCheckPeerName On
    SSLProxyCheckPeerExpire On
    {{- if .Values.backendRoute.caSecretName }}
    SSLProxyCACertificateFile /etc/backend-route-ca/ca.crt
    {{- else }}
    SSLProxyCACertificateFile /etc/pki/tls/certs/ca-bundle.crt
    {{- end }}
    # URL publique d'origine pour Spring Boot, indépendante du Host de routage.
    RequestHeader unset Forwarded
    RequestHeader set X-Forwarded-Host "{{ .Values.route.host }}"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    <Location "/">
      Require all granted
    </Location>
    <LocationMatch "^/actuator(?:/|$)">
      Require all denied
    </LocationMatch>
    ProxyPass "/" "https://{{ .Values.backendRoute.host }}/" connectiontimeout=5 timeout={{ .Values.proxyTimeout }}
    ProxyPassReverse "/" "https://{{ .Values.backendRoute.host }}/"
    # Cookies host-only transmis tels quels ; Domain explicite réécrit si nécessaire.
    ProxyPassReverseCookieDomain "{{ .Values.backendRoute.host }}" "{{ .Values.route.host }}"
