apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "httpd.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "httpd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "httpd.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "httpd.selector" . | nindent 8 }}
      annotations:
        checksum/httpd: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "httpd.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: httpd
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [/usr/bin/httpd]
          args: [-f, /etc/custom-httpd/httpd.conf, -DFOREGROUND]
          ports:
            - {name: http, containerPort: {{ .Values.port }}, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: runtime, mountPath: /run/httpd}
            - {name: config, mountPath: /etc/custom-httpd, readOnly: true}
            {{- if .Values.backendRoute.caSecretName }}
            - {name: backend-route-ca, mountPath: /etc/backend-route-ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "httpd.name" . }}
        {{- if .Values.backendRoute.caSecretName }}
        - name: backend-route-ca
          secret:
            secretName: {{ .Values.backendRoute.caSecretName }}
            items:
              - key: {{ .Values.backendRoute.caSecretKey }}
                path: ca.crt
        {{- end }}
