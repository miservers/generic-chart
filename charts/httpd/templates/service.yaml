apiVersion: v1
kind: Service
metadata:
  name: {{ include "httpd.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "httpd.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "httpd.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      protocol: TCP
