{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "httpd.name" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.route.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    {{- if eq .Values.session "enabled" }}
    router.openshift.io/cookie_name: {{ .Values.route.cookieName | quote }}
    haproxy.router.openshift.io/disable_cookies: "false"
    {{- else }}
    haproxy.router.openshift.io/disable_cookies: "true"
    {{- end }}
spec:
  host: {{ include "httpd.routeHost" . | quote }}
  to:
    kind: Service
    name: {{ include "httpd.name" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
