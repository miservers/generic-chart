apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications-metier
  namespace: openshift-gitops
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - app: app1
                        envs: [int, rec]
                        components: [httpd, springboot]
                      - app: app2
                        envs: [int, rec]
                        components: [httpd, springboot]
                - list:
                    elementsYaml: |
                      {{- range $env := .envs }}
                      {{- range $component := $.components }}
                      - env: {{ $env | quote }}
                        component: {{ $component | quote }}
                      {{- end }}
                      {{- end }}
          - clusters:
              selector:
                matchLabels:
                  deploy-applications-metier: "true"
  template:
    metadata:
      name: '{{ .app }}-{{ .env }}-{{ if eq .component "httpd" }}prez{{ else }}app{{ end }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/miservers/generic-chart.git
        targetRevision: main
        path: 'charts/{{ .component }}'
        helm:
          releaseName: '{{ .app }}-{{ .env }}-{{ if eq .component "httpd" }}prez{{ else }}app{{ end }}'
          valueFiles:
            - '../../environments/{{ .app }}/{{ .env }}/{{ .component }}.yaml'
          parameters:
            - name: appName
              value: '{{ .app }}'
            - name: replicas
              value: "2"
      destination:
        server: '{{ .server }}'
        namespace: '{{ .app }}-{{ .env }}{{ if eq .component "httpd" }}fr{{ end }}'
      syncPolicy:
        syncOptions:
          - FailOnSharedResource=true
