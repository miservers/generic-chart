apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monapp-rec-springboot
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/miservers/generic-chart.git
    targetRevision: main
    path: charts/springboot
    helm:
      releaseName: monapp-rec-springboot
      valueFiles:
      - ../../environments/monapp/rec/springboot.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monapp-back-rec
  syncPolicy:
    syncOptions:
    - FailOnSharedResource=true
    automated:
      prune: true
      selfHeal: true
